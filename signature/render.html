<!doctype html>
<!-- Source for the signature mark and icon PNGs; render-signature.sh screenshots it once per ?part=.
     The animated art is signature/gif.html (render-gif.sh). -->
<html>
<head>
<meta charset="utf-8">
<script src="../config.js"></script>
<script src="../icons.js"></script>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  .mark { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(145deg, #5b86ff, #1f3fd1 70%); color: #fff; font-weight: 800; font-size: 19px; letter-spacing: -0.04em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .ico { width: 32px; height: 32px; color: #7f7f8c; }
  .ico svg { width: 100%; height: 100%; display: block; }

</style>
</head>
<body>
<script>
  const P = window.PROFILE;
  const part = new URLSearchParams(location.search).get("part");
  if (part === "mark") {
    document.body.innerHTML = `<div class="mark">${P.initials}</div>`;
  } else {
    document.body.innerHTML = `<div class="ico">${icon(part)}</div>`;
  }
</script>
</body>
</html>
